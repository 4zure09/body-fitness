openapi: 3.1.0
info:
  title: Body Fitness API
  version: 0.1.0
  description: >-
    API hỗ trợ quản lý bài tập, dinh dưỡng, chế độ cá nhân và tiến độ.
    Nội dung tư vấn chỉ mang tính tham khảo, không thay thế tư vấn y khoa.
servers:
  - url: /
    description: Current API origin
security: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Kiểm tra tiến trình API còn hoạt động
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Kiểm tra API sẵn sàng nhận request
      responses:
        "200":
          description: API and required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: At least one required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Đăng ký tài khoản người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate refresh token và cấp token pair mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refresh token rotated and a new token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Thu hồi refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Refresh token revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Lấy tài khoản đang đăng nhập
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/access-check:
    get:
      operationId: checkAdminAccess
      summary: Kiểm tra quyền admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller has the admin role
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/muscle-groups:
    get:
      operationId: listMuscleGroups
      summary: Danh sách nhóm cơ
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated muscle groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuscleGroupPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createMuscleGroup
      summary: Tạo nhóm cơ
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MuscleGroupInput"
      responses:
        "201":
          description: Muscle group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuscleGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/muscle-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getMuscleGroup
      summary: Chi tiết nhóm cơ
      responses:
        "200":
          description: Muscle group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuscleGroup"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMuscleGroup
      summary: Cập nhật nhóm cơ
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MuscleGroupInput"
      responses:
        "200":
          description: Muscle group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuscleGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMuscleGroup
      summary: Xóa mềm nhóm cơ chưa được sử dụng
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Muscle group deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/equipment:
    get:
      operationId: listEquipment
      summary: Danh sách dụng cụ
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createEquipment
      summary: Tạo dụng cụ
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/EquipmentInput"
      responses:
        "201":
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/equipment/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getEquipment
      summary: Chi tiết dụng cụ
      responses:
        "200":
          description: Equipment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateEquipment
      summary: Cập nhật dụng cụ
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/EquipmentInput"
      responses:
        "200":
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteEquipment
      summary: Xóa mềm dụng cụ chưa được sử dụng
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Equipment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/exercises:
    get:
      operationId: listExercises
      summary: Danh sách bài tập
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/Difficulty"
        - name: equipment_id
          in: query
          schema:
            type: string
            format: uuid
        - name: muscle_group_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExercisePage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createExercise
      summary: Tạo bài tập
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ExerciseInput"
      responses:
        "201":
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidReference"
  /api/v1/exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getExercise
      summary: Chi tiết bài tập
      responses:
        "200":
          description: Exercise details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateExercise
      summary: Cập nhật bài tập
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ExerciseInput"
      responses:
        "200":
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidReference"
    delete:
      operationId: deleteExercise
      summary: Xóa mềm bài tập
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Exercise deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/foods:
    get:
      operationId: listFoods
      summary: Danh sách thực phẩm
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: brand
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated foods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createFood
      summary: Tạo thực phẩm cùng calo và macro
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/FoodInput"
      responses:
        "201":
          description: Food created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/foods/{foodID}:
    parameters:
      - $ref: "#/components/parameters/FoodID"
    get:
      operationId: getFood
      summary: Chi tiết thực phẩm, calo và macro
      responses:
        "200":
          description: Food details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateFood
      summary: Cập nhật thực phẩm, calo và macro
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/FoodInput"
      responses:
        "200":
          description: Food updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteFood
      summary: Xóa mềm thực phẩm và các khẩu phần liên quan
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Food deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/foods/{foodID}/servings:
    parameters:
      - $ref: "#/components/parameters/FoodID"
    get:
      operationId: listFoodServings
      summary: Danh sách khẩu phần và dinh dưỡng quy đổi
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated food servings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFoodServing
      summary: Tạo khẩu phần
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ServingInput"
      responses:
        "201":
          description: Serving created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Serving"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/foods/{foodID}/servings/{servingID}:
    parameters:
      - $ref: "#/components/parameters/FoodID"
      - $ref: "#/components/parameters/ServingID"
    get:
      operationId: getFoodServing
      summary: Chi tiết khẩu phần và dinh dưỡng quy đổi
      responses:
        "200":
          description: Serving details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Serving"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateFoodServing
      summary: Cập nhật khẩu phần
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ServingInput"
      responses:
        "200":
          description: Serving updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Serving"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteFoodServing
      summary: Xóa khẩu phần
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Serving deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SearchQuery:
      name: q
      in: query
      description: Tìm kiếm không phân biệt hoa thường theo tên
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FoodID:
      name: foodID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServingID:
      name: servingID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    MuscleGroupInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MuscleGroupInput"
    EquipmentInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EquipmentInput"
    ExerciseInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExerciseInput"
    FoodInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FoodInput"
    ServingInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServingInput"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials/token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Account disabled or role not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate value or resource currently in use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidReference:
      description: Referenced resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, checked_at]
      properties:
        status:
          type: string
          examples: [ok]
        checked_at:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    User:
      type: object
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [user, admin]
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    BodyRegion:
      type: string
      enum: [upper_body, lower_body, core, full_body]
    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced]
    Involvement:
      type: string
      enum: [primary, secondary]
    ReferenceUnit:
      type: string
      enum: [g, ml, unit]
    MuscleGroupInput:
      type: object
      additionalProperties: false
      required: [name, body_region]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        body_region:
          $ref: "#/components/schemas/BodyRegion"
        description:
          type: string
          maxLength: 2000
          default: ""
    MuscleGroup:
      allOf:
        - $ref: "#/components/schemas/MuscleGroupInput"
        - type: object
          required: [id, description, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EquipmentInput:
      type: object
      additionalProperties: false
